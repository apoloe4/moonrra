name: MoonRRA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: node tools/check-toolchain.mjs
      - run: moon check --deny-warn --target ${{ matrix.target }}
      - run: moon build --deny-warn --target ${{ matrix.target }}
      - run: moon test --deny-warn --target ${{ matrix.target }}
      - run: moon run examples/basic --target ${{ matrix.target }}
      - run: moon run examples/sensor --target ${{ matrix.target }}
      - run: moon run examples/traffic --target ${{ matrix.target }}
      - run: moon run examples/fleet --target ${{ matrix.target }}
      - name: Replay the out-of-order fixture (Node)
        if: matrix.target == 'js'
        run: |
          moon run examples/collector_node --target js -- fixtures/telegraf.ndjson > /tmp/moonrra-rows
          node tools/check-collector.mjs fixture /tmp/moonrra-rows
      - name: Collect Linux memory with Telegraf and verify the native replay
        if: matrix.target == 'native'
        run: |
          docker run --rm -v "$PWD/fixtures/telegraf.conf:/etc/telegraf/telegraf.conf:ro" telegraf:1.36.0 telegraf --once > /tmp/moonrra-mem.ndjson
          moon run examples/collector --target native -- /tmp/moonrra-mem.ndjson > /tmp/moonrra-rows
          node tools/check-collector.mjs live /tmp/moonrra-rows /tmp/moonrra-mem.ndjson
      - name: Native file workflow
        if: matrix.target == 'native'
        run: moon run examples/files --target native
      - name: RRDtool differential check
        if: matrix.target == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y rrdtool
          python3 tools/compare-rrd.py
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code



